name: Build and Test
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:
permissions:
  contents: read

jobs:
  build:
    name: Go CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Use the toolchain declared by the root module.
          go-version-file: 'go.mod'
          cache: true
      - name: Build all modules and test supported packages
        env:
          # Run the supported EXCC suite as the required gate.  Legacy
          # compatibility fixtures are exercised separately below.
          EXCC_CI_SUPPORTED_ONLY: '1'
        run: sh ./run_tests.sh
      - name: Run legacy compatibility fixtures
        continue-on-error: true
        run: sh ./run_tests.sh

  platforms:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            goamd64: v1
            cc: gcc
            cxx: g++
            exe: ''
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            goarm64: v8.0
            cc: gcc
            cxx: g++
            exe: ''
          - runner: windows-2025
            goos: windows
            goarch: amd64
            goamd64: v1
            cc: gcc
            cxx: g++
            exe: .exe
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            goarm64: v8.0
            cc: aarch64-w64-mingw32-gcc
            cxx: aarch64-w64-mingw32-g++
            exe: .exe
          - runner: macos-26-intel
            goos: darwin
            goarch: amd64
            goamd64: v1
            cc: clang
            cxx: clang++
            exe: ''
          - runner: macos-26
            goos: darwin
            goarch: arm64
            goarm64: v8.0
            cc: clang
            cxx: clang++
            exe: ''
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Set up LLVM-MinGW for Windows ARM64
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          $root = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Invoke-WebRequest -Uri 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip' -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne '312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba') {
            throw "LLVM-MinGW checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $root
          $toolchain = (Get-ChildItem -Path $root -Directory -Filter 'llvm-mingw-*').FullName
          "$toolchain\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and verify exccd
        shell: bash
        env:
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM64: ${{ matrix.goarm64 }}
          GOWORK: 'off'
        run: |
          set -eux
          mkdir -p dist
          LDFLAGS=''
          if [ "${GOOS}" = windows ]; then
            LDFLAGS='-linkmode=external -extldflags=-static'
          fi
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" \
            -o "dist/exccd${{ matrix.exe }}" .
          "./dist/exccd${{ matrix.exe }}" --version
          if [ "${GOOS}" = windows ]; then
            OBJDUMP=objdump
            if [ "${GOARCH}" = arm64 ]; then
              OBJDUMP=llvm-objdump
            fi
            IMPORTS=$("${OBJDUMP}" -p "dist/exccd${{ matrix.exe }}" | \
              sed -n 's/.*DLL Name: //p')
            printf '%s\n' "${IMPORTS}"
            if printf '%s\n' "${IMPORTS}" | grep -Eiq \
              '^(libgcc|libstdc\+\+|libwinpthread|libc\+\+|libunwind).*\.dll$'; then
              echo '::error::Windows binary depends on a compiler runtime DLL.'
              exit 1
            fi
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: >-
            --timeout=10m
            --build-tags=rpctest
            --default=none
            --enable=staticcheck
            --enable=unconvert
            --enable=ineffassign
            --enable=govet
            --enable=misspell
            --enable=unused
