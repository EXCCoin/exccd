name: Build and Test
on: [push, pull_request]
permissions:
  contents: read

jobs:
  build:
    name: Go CI
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # Use the toolchain declared by the root module.
          go-version-file: 'go.mod'
          cache: true
      - name: Build all modules and test supported packages
        env:
          # Run the supported EXCC suite as the required gate.  Legacy
          # compatibility fixtures are exercised separately below.
          EXCC_CI_SUPPORTED_ONLY: '1'
        run: sh ./run_tests.sh
      - name: Run legacy compatibility fixtures
        continue-on-error: true
        run: sh ./run_tests.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: >-
            --timeout=10m
            --build-tags=rpctest
            --default=none
            --enable=staticcheck
            --enable=unconvert
            --enable=ineffassign
            --enable=govet
            --enable=misspell
            --enable=unused
